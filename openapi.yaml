openapi: 3.1.0

info:
  title: URL Shortener API
  description: |
    API for creating, discovering, and resolving short URLs.

    A short URL can optionally have a maximum number of clicks
    and a custom lifetime.
  version: 1.0.0

servers:
  - url: http://localhost:4040
    description: Local development server

paths:
  /link:
    post:
      summary: Create a short URL
      description: |
        Creates a short URL for the provided original URL.

        The link can optionally have:
        - a maximum number of clicks;
        - a custom lifetime.

        If lifetime_seconds is omitted, the link remains active
        for 180 days.

        The maximum allowed lifetime is 180 days.
      operationId: createShortUrl

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLinkRequest'
            examples:
              default:
                summary: Create a link with default lifetime
                value:
                  url: https://example.com/some/long/url

              withLimits:
                summary: Create a link with click and lifetime limits
                value:
                  url: https://example.com/some/long/url
                  clicks_limit: 100
                  lifetime_seconds: 86400

      responses:
        '201':
          description: Short URL created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateLinkResponse'
              example:
                url: https://example.com/some/long/url
                code: aB3xK9qZ

        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                invalidUrl:
                  summary: Invalid URL
                  value:
                    type: invalid_url
                    title: Invalid URL
                    detail: Provided URL is incorrect. Only http or https schemas are allowed and schema must be lower-cased

                invalidLifetime:
                  summary: Invalid lifetime
                  value:
                    type: invalid_short_code_lifetime
                    title: Invalid short code lifetime
                    detail: Short code lifetime must be between 1 second and 180 days

                invalidClicksLimit:
                  summary: Invalid click limit
                  value:
                    type: invalid_short_code_clicks_limit
                    title: Invalid short code clicks limit
                    detail: Short code clicks limit must be at least 1

        '409':
          description: Generated short code already exists
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: conflict
                title: Duplicate code
                detail: The generated short code is already taken. Please try again.

        '413':
          description: URL is too long
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: invalid_url
                title: URL is too long
                detail: Provided URL is too long

        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: internal
                title: Internal Server Error
                detail: An unexpected error occurred on the server. Please try again later.

  /link/{code}:
    get:
      summary: Discover a short URL
      description: |
        Returns information about a short URL without redirecting.

        The response contains the original URL, short code,
        click count, optional click limit, creation time,
        and optional expiration time.
      operationId: discoverShortUrl

      parameters:
        - $ref: '#/components/parameters/ShortCode'

      responses:
        '200':
          description: Short URL information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverLinkResponse'
              example:
                url: https://example.com/some/long/url
                code: aB3xK9qZ
                clicks: 42
                clicks_limit: 100
                created_at: "2026-09-04T12:00:00Z"
                expires_at: "2027-03-03T12:00:00Z"

        '400':
          description: Short code is too long
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: invalid_code
                title: Short code is too long
                detail: Provided short code is too long

        '404':
          description: Short code not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: url_not_found
                title: URL not found
                detail: The requested short code does not exist

        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: internal
                title: Internal Server Error
                detail: An unexpected error occurred on the server. Please try again later.

  /{code}:
    get:
      summary: Redirect to the original URL
      description: |
        Resolves a short code and redirects the client to
        the corresponding original URL.

        The endpoint returns a temporary redirect.
      operationId: redirectToOriginalUrl

      parameters:
        - $ref: '#/components/parameters/ShortCode'

      responses:
        '307':
          description: Temporary redirect to the original URL
          headers:
            Location:
              description: Original URL
              required: true
              schema:
                type: string
                format: uri
                example: https://example.com/some/long/url

        '400':
          description: Short code is too long
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: invalid_code
                title: Short code is too long
                detail: Provided short code is too long

        '404':
          description: Short code not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: url_not_found
                title: URL not found
                detail: The requested short code does not exist

        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: internal
                title: Internal Server Error
                detail: An unexpected error occurred on the server. Please try again later.

components:
  parameters:
    ShortCode:
      name: code
      in: path
      required: true
      description: Short URL code
      schema:
        type: string
        minLength: 1
        maxLength: 8
        example: aB3xK9qZ

  schemas:
    CreateLinkRequest:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          maxLength: 2048
          description: |
            Original URL that should be shortened.
            Only HTTP and HTTPS URLs are accepted.
          example: https://example.com/some/long/url

        clicks_limit:
          type:
            - integer
            - "null"
          format: int64
          minimum: 1
          description: |
            Maximum number of clicks allowed for the link.
            If omitted, the link has no click limit.
          example: 100

        lifetime_seconds:
          type:
            - integer
            - "null"
          format: int64
          minimum: 1
          maximum: 15552000
          description: |
            Lifetime of the link in seconds.

            If omitted, the lifetime is set to 180 days
            (15552000 seconds).
          example: 86400

    CreateLinkResponse:
      type: object
      required:
        - url
        - code
      properties:
        url:
          type: string
          description: Original URL
          example: https://example.com/some/long/url

        code:
          type: string
          minLength: 1
          maxLength: 8
          description: Generated short code
          example: aB3xK9qZ

    DiscoverLinkResponse:
      type: object
      required:
        - url
        - code
        - clicks
        - clicks_limit
        - created_at
        - expires_at
      properties:
        url:
          type: string
          description: Original URL
          example: https://example.com/some/long/url

        code:
          type: string
          minLength: 1
          maxLength: 8
          description: Short URL code
          example: aB3xK9qZ

        clicks:
          type: integer
          format: int64
          minimum: 0
          description: Number of clicks received by the link
          example: 42

        clicks_limit:
          type:
            - integer
            - "null"
          format: int64
          minimum: 1
          description: |
            Maximum number of clicks allowed for the link.
            Null means that the link has no click limit.
          example: 100

        created_at:
          type: string
          format: date-time
          description: Time when the short URL was created
          example: "2026-09-04T12:00:00Z"

        expires_at:
          type:
            - string
            - "null"
          format: date-time
          description: |
            Time when the short URL expires.
            Null means that the link does not have an expiration time.
          example: "2027-03-03T12:00:00Z"

    ProblemDetails:
      type: object
      required:
        - type
        - title
        - detail
      properties:
        type:
          type: string
          description: Machine-readable error type
          example: invalid_url

        title:
          type: string
          description: Short human-readable error title
          example: Invalid URL

        detail:
          type: string
          description: Detailed explanation of the error
          example: Provided URL is too long

[package]
name = "url-shortener"
version = "0.2.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
serde_json = "1.0"
async-trait = "0.1.92"
thiserror = "2.0.20"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "macros", "chrono", "migrate"] }
nanoid = "=0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
url = "2.5.8"
chrono = {version = "0.4.45", features = ["serde"]}
axum-prometheus = "0.10.1"
metrics = "0.24.6"
